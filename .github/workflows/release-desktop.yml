# Release the desktop CLI (`tsd`) as a downloadable zip.
#
# Trigger: push a tag like `desktop-v1.0.0` (do NOT push tags casually —
# each tag creates a public GitHub Release).
#
# The Windows asset MUST be named exactly `tsd-x86_64-pc-windows-msvc.zip`
# because tools/win-installer/install-tsideload.bat downloads
# https://github.com/goddie9x/TSideload/releases/latest/download/tsd-x86_64-pc-windows-msvc.zip

name: release-desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # create Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: tsd for Windows x86_64
    runs-on: windows-latest # 2x minutes — keep this job lean
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # The installer/zip version must match the release tag (desktop-vX.Y.Z).
      # The checked-in Cargo.toml versions are only a fallback — stamp them
      # from the tag so a forgotten bump can never ship a 0.1.0-labelled
      # asset again. `cargo build` re-syncs Cargo.lock automatically.
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad version from tag: $v" }
          foreach ($f in 'crates/tsd/Cargo.toml', 'crates/tsideload-core/Cargo.toml') {
            $c = Get-Content -Raw $f
            $c = $c -replace '(?m)^version = "[^"]+"', "version = `"$v`""
            Set-Content -Path $f -Value $c -NoNewline
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Build tsd (release)
        run: cargo build --release -p tsd

      - name: Package zip (exact asset name required by install-tsideload.bat)
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/tsd.exe `
            -DestinationPath tsd-x86_64-pc-windows-msvc.zip -Force
          Get-ChildItem tsd-x86_64-pc-windows-msvc.zip

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/tsd-x86_64-pc-windows-msvc.zip
          # default: full release (not prerelease) so that
          # /releases/latest/download/ resolves to it

  build-linux:
    name: tsd for Linux x86_64
    runs-on: ubuntu-latest # 1x minutes
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # See build-windows: stamp versions from the tag so the release assets
      # always carry the tag version.
      - name: Stamp version from tag
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version from tag: $v"; exit 1; }
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$v\"/" crates/tsd/Cargo.toml crates/tsideload-core/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Build tsd (release)
        run: cargo build --release -p tsd

      - name: Package zip
        run: |
          mkdir -p dist
          cp target/release/tsd dist/
          cd dist && zip -9 ../tsd-x86_64-unknown-linux-gnu.zip tsd
          cd .. && ls -la tsd-x86_64-unknown-linux-gnu.zip

      - name: Upload asset to the same Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/tsd-x86_64-unknown-linux-gnu.zip

  build-gui-windows:
    name: TSideload GUI (Tauri) for Windows x86_64
    runs-on: windows-latest # 2x minutes
    steps:
      - uses: actions/checkout@v4

      # See build-windows: stamp versions from the tag. The GUI version
      # lives in two places: src-tauri/Cargo.toml and tauri.conf.json
      # (which names the NSIS/MSI bundles).
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad version from tag: $v" }
          $c = Get-Content -Raw apps/desktop/gui/src-tauri/Cargo.toml
          $c = $c -replace '(?m)^version = "[^"]+"', "version = `"$v`""
          Set-Content -Path apps/desktop/gui/src-tauri/Cargo.toml -Value $c -NoNewline
          $j = Get-Content -Raw apps/desktop/gui/src-tauri/tauri.conf.json
          $j = $j -replace '"version":"[^"]+"', "`"version`":`"$v`""
          Set-Content -Path apps/desktop/gui/src-tauri/tauri.conf.json -Value $j -NoNewline
          # The GUI embeds tsideload-core via path: stamp it too, or a
          # forgotten bump would ship an X.Y.Z bundle with an older core.
          $k = Get-Content -Raw apps/desktop/crates/tsideload-core/Cargo.toml
          $k = $k -replace '(?m)^version = "[^"]+"', "version = `"$v`""
          Set-Content -Path apps/desktop/crates/tsideload-core/Cargo.toml -Value $k -NoNewline

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/gui/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # No frontend build step: the GUI is static HTML/JS
      # (tauri.conf.json: frontendDist = ../src, beforeBuildCommand = "").
      - name: Build Tauri app (NSIS + MSI)
        working-directory: apps/desktop/gui
        run: cargo tauri build

      - name: Upload GUI bundles to the same Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/gui/src-tauri/target/release/bundle/nsis/TSideload_*_x64-setup.exe
            apps/desktop/gui/src-tauri/target/release/bundle/msi/TSideload_*_x64_en-US.msi
