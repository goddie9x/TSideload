[package]
name = "tsideload-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core sideloading logic for TSideload desktop (wraps the isideload crate)"

[dependencies]
# Pinned to the rev reviewed on 2026-11-02. Bump deliberately.
# default-features disabled to avoid the OS keyring dependency; we use
# file-based storage (fs-storage) instead. `install` pulls in idevice.
isideload = { git = "https://github.com/nab138/isideload", rev = "326e56229d0727cb6e7b34c8cf03e37e2cd3e17d", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
idevice = { version = "0.1.68", default-features = false, features = ["usbmuxd", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Matches the rustls version isideload uses; needed to install the default
# crypto provider (reqwest is built with rustls-no-provider upstream).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
tracing = "0.1"
# Platform config dir for storage (replaces the old CWD-relative dir).
dirs = "6"
# Direct deps for the imported-certificate (.p12 + .mobileprovision) flow.
# Versions pinned to match what the `isideload` crate uses so the types
# (`RsaPrivateKey`, `Certificate`, `ProvisioningProfile`) are identical.
apple-codesign-quick = "0.1"
p12-keystore = { version = "0.3.0-rc4", package = "isideload-p12-keystore" }
rsa = "0.9"
x509-cert = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
