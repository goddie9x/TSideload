[package]
name = "tsd"
version = "0.1.4"
edition.workspace = true
license.workspace = true
description = "TSideload desktop CLI: sign IPAs with a free Apple ID and install them over USB"

[[bin]]
name = "tsd"
path = "src/main.rs"

[dependencies]
tsideload-core = { path = "../tsideload-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
