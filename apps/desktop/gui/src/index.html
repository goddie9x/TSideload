<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSideload</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #101418; color: #e8edf2;
         margin: 0; padding: 24px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 0; color: #8b98a5; }
  #lang { margin-left: auto; }
  section { background: #182028; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  button { background: #2f81f7; color: #fff; border: 0; border-radius: 8px;
           padding: 8px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  select { background: #0d1117; color: #e8edf2; border: 1px solid #30363d;
           border-radius: 8px; padding: 6px; }
  #devices { list-style: none; padding: 0; margin: 12px 0 0; }
  #devices li { font-family: monospace; padding: 6px 0; border-top: 1px solid #212a33; }
  .hint { color: #8b98a5; font-size: 13px; }
  .note { background: #3b2f12; border: 1px solid #9e6a03; border-radius: 8px;
          padding: 10px 12px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="app.title">TSideload</h1>
  <p data-i18n="app.subtitle">Free iOS sideloading</p>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="vi">Tiếng Việt</option>
  </select>
</header>

<section>
  <h2 data-i18n="devices.title">Devices</h2>
  <button id="refresh" data-i18n="devices.refresh">Refresh</button>
  <ul id="devices"></ul>
  <p id="devcount" class="hint"></p>
</section>

<section>
  <h2 data-i18n="install.start">Sign &amp; Install</h2>
  <p class="note" data-i18n="install.gui_todo"></p>
</section>

<script src="app.js"></script>
</body>
</html>
