<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSideload</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #101418; color: #e8edf2;
         margin: 0; padding: 24px; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 0; color: #8b98a5; }
  #lang { margin-left: auto; }
  section { background: #182028; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  button { background: #2f81f7; color: #fff; border: 0; border-radius: 8px;
           padding: 8px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #30363d; }
  button.danger { background: #a40e26; }
  select, input[type="text"], input[type="email"], input[type="password"] {
    background: #0d1117; color: #e8edf2; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px; }
  input[readonly] { color: #8b98a5; }
  #devices { list-style: none; padding: 0; margin: 12px 0 0; }
  #devices li { font-family: monospace; padding: 6px 0; border-top: 1px solid #212a33; }
  .hint { color: #8b98a5; font-size: 13px; }
  .err { color: #ff7b72; font-size: 13px; }
  .ok { color: #3fb950; font-size: 13px; }
  .form label { display: flex; gap: 8px; align-items: center; margin: 10px 0;
                flex-wrap: wrap; }
  .form label > span:first-child { min-width: 150px; color: #8b98a5; font-size: 13px; }
  .form input[type="text"], .form input[type="email"], .form input[type="password"] {
    flex: 1; min-width: 200px; }
  .form .check { cursor: pointer; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65);
           display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: #182028; border: 1px solid #30363d; border-radius: 12px;
               padding: 20px; width: 400px; max-width: 92vw; }
  .modal-box h3 { margin: 0 0 10px; font-size: 16px; }
  .modal-box .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  section .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #twofa_code { width: 140px; font-size: 18px; letter-spacing: 4px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="app.title">TSideload</h1>
  <p data-i18n="app.subtitle">Free iOS sideloading</p>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="vi">Tiếng Việt</option>
  </select>
</header>

<section>
  <h2 data-i18n="devices.title">Devices</h2>
  <button id="refresh" data-i18n="devices.refresh">Refresh</button>
  <ul id="devices"></ul>
  <p id="devcount" class="hint"></p>
</section>

<section>
  <h2 data-i18n="install.start">Sign &amp; Install</h2>
  <div class="form">
    <label>
      <span data-i18n="install.ipa_path">IPA file</span>
      <input type="text" id="ipa_path" readonly data-i18n-ph="install.pick_ipa" placeholder="Choose .ipa file">
      <button id="browse" class="secondary" data-i18n="install.browse">Browse…</button>
    </label>
    <label>
      <span data-i18n="install.device">Target device</span>
      <select id="target_device"></select>
    </label>
    <label>
      <span data-i18n="install.method">Signing method</span>
      <select id="sign_method">
        <option value="apple_id" data-i18n="install.method_apple_id">Apple ID</option>
        <option value="cert" data-i18n="install.method_cert">Imported certificate</option>
      </select>
    </label>
    <div id="cert_wrap" hidden>
      <label>
        <span data-i18n="certs.select">Certificate</span>
        <select id="cert_name"></select>
      </label>
      <label>
        <span data-i18n="certs.p12_password">.p12 password</span>
        <input type="password" id="p12_password" autocomplete="off">
      </label>
      <p class="hint" data-i18n="certs.import_hint">Import one with: tsd import-cert --p12 cert.p12 --provision app.mobileprovision</p>
    </div>
    <div id="appleid_wrap">
    <label>
      <span data-i18n="auth.apple_id">Apple ID (email)</span>
      <input type="email" id="apple_id" autocomplete="username">
    </label>
    <label>
      <span data-i18n="auth.password">Password</span>
      <input type="password" id="apple_password" autocomplete="current-password">
    </label>
    </div>
    <p class="hint" data-i18n="install.password_hint"></p>
    <label class="check">
      <input type="checkbox" id="mem_limit">
      <span data-i18n="install.increased_memory">Increased memory limit (for JIT-heavy apps)</span>
    </label>
    <button id="do_install" data-i18n="install.start">Sign &amp; Install</button>
  </div>
  <p id="progress" class="hint" hidden></p>
  <p id="install_msg" class="hint"></p>
</section>

<section id="pairing_box" hidden>
  <h2 data-i18n="pairing.title">Pairing file</h2>
  <p id="pairing_status" class="hint"></p>
  <div class="row">
    <button id="push_pairing" class="secondary" data-i18n="pairing.push_again">Re-push pairing file</button>
    <button id="export_pairing" class="secondary" data-i18n="pairing.export">Export pairing file</button>
  </div>
  <p id="pairing_msg" class="hint"></p>
</section>

<div id="twofa_modal" class="modal" hidden>
  <div class="modal-box">
    <h3 data-i18n="auth.twofa_title">Two-factor authentication</h3>
    <p id="twofa_error" class="err" hidden></p>
    <p id="twofa_desc" class="hint"></p>
    <div id="twofa_code_wrap">
      <label>
        <span data-i18n="auth.twofa_code_label">6-digit code</span>
        <input type="text" id="twofa_code" inputmode="numeric" maxlength="12" autocomplete="one-time-code">
      </label>
      <p class="hint" data-i18n="auth.twofa_hint"></p>
      <div class="row">
        <button id="twofa_submit" data-i18n="auth.twofa_submit">Submit code</button>
      </div>
    </div>
    <div class="row" id="twofa_methods">
      <button id="twofa_devices" class="secondary" data-i18n="auth.twofa_devices">Send to my trusted devices</button>
      <span id="twofa_sms_wrap">
        <select id="twofa_sms_number"></select>
        <button id="twofa_sms" class="secondary" data-i18n="auth.twofa_sms">Send via SMS</button>
      </span>
    </div>
    <div class="row">
      <button id="twofa_resend" class="secondary" data-i18n="auth.twofa_resend">Resend code</button>
      <button id="twofa_abort" class="danger" data-i18n="auth.twofa_abort">Abort login</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
