[package]
name = "tsideload-gui"
version = "0.1.0"
edition = "2021"

# NOTE: excluded from the apps/desktop workspace (see ../../Cargo.toml).
# Builds on Windows/macOS only — needs WebView2 / WebKit.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tsideload-core = { path = "../../crates/tsideload-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
